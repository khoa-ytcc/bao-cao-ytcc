<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hội nghị viên chức 2026–2027</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            padding: 40px 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.5px;
            margin-bottom: 28px;
            color: #000000;
        }

        p.prompt {
            font-size: 19px;
            color: #000000;
            margin-bottom: 18px;
            font-weight: 400;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-link {
            display: block;
            background-color: #eef2fe;
            border-radius: 12px;
            padding: 16px 20px;
            text-decoration: none;
            transition: background-color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-link:active {
            background-color: #dfe7fb;
        }

        .btn-link span {
            font-size: 18px;
            color: #0a3d62;
            text-decoration: underline;
            font-weight: 400;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <h1>Hội nghị viên chức<br>2026–2027</h1>

    <p class="prompt">Chọn nội dung:</p>

    <div class="button-group">
        <!-- Nút 1: Link website trường -->
        <a href="http://fphhcm.edu.vn/bao-cao-tong-ket-nam-hoc/" class="btn-link">
            <span>1. Báo cáo tổng kết năm học</span>
        </a>

        <!-- Nút 2: Link Google Drive -->
        <a href="https://drive.google.com/file/d/1UUFp_MAQClSWqIdIeDgOJEvAWpBoKu_Y/view?usp=drive_link" class="btn-link">
            <span>2. Báo cáo công đoàn</span>
        </a>
    </div>
</body>
</html>
